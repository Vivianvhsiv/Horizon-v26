name: Horizon QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [horizon-network-map-fix]

jobs:
  structural-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Horizon structural and Network Map regression checks
        run: python qa_check.py
